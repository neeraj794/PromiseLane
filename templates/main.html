{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fffaf7">
    <meta name="description" content="Meet someone who shares your values and your vision for the future.">
    <title>{% block title %}PromiseLane | Meaningful connections{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/nav.css' %}">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    <link rel="icon" href="/media/icon/promiselane-logo.svg">
    {% block page_styles %}{% endblock %}
    <link rel="stylesheet" href="{% static 'css/premium.css' %}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include 'nav.html' %}
    <main class="page-content" id="main-content">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
